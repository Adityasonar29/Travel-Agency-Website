<!-- Stats Section (Flyward — number counter animation, dark bg) -->
<section class="py-24 md:py-40 bg-ink">
    <div class="max-w-[1440px] mx-auto px-6 md:px-12 lg:px-24">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-8 md:gap-12">
            {% for stat in stats %}
            <div class="text-center stat-item" style="opacity:0;transform:translateY(40px);">
                <div class="text-h1 md:text-display font-heading font-light text-gold">
                    <span class="stat-prefix">{{ stat.prefix }}</span>
                    <span class="stat-value" data-target="{{ stat.value }}">0</span>
                    <span class="stat-suffix">{{ stat.suffix }}</span>
                </div>
                <div class="text-[10px] font-body text-stone tracking-[0.15em] uppercase mt-3">{{ stat.label }}</div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>

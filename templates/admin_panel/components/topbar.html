{% load static %}

<header class="admin-topbar">

    <div class="topbar-left admin-mobile-toggle">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Open navigation" aria-controls="adminSidebar" aria-expanded="false">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <div class="topbar-right">

        <nav class="admin-quick-links" aria-label="Account links">
            <a href="{% url 'accounts:profile' %}">Profile</a>
            <a href="/">View Website</a>
        </nav>

        <div class="admin-profile">
            <div class="profile-info">
                <span class="profile-name">
                    {{ request.user.get_full_name|default:request.user.username }}
                </span>
                <span class="profile-role">
                    Administrator
                </span>
            </div>

            <div class="profile-image">
                {% if request.user.profile_image %}
                    <img class="profile-avatar" src="{{ request.user.profile_image.url }}" alt="" width="40" height="40">
                {% else %}
                    <span class="profile-fallback-avatar">{{ request.user.first_name|default:request.user.username|first|upper }}</span>
                {% endif %}
            </div>

        </div>

    </div>

</header>

<script>

const profile=document.querySelector(".admin-profile");

if(profile){

    profile.addEventListener("click",function(){

        this.classList.toggle("open");

    });

}

const toggle=document.getElementById("sidebarToggle");
const sidebar=document.getElementById("adminSidebar");
const closeButton=document.getElementById("sidebarClose");
const backdrop=document.getElementById("sidebarBackdrop");

if(toggle&&sidebar&&backdrop){
    const closeSidebar=()=>{
        document.body.classList.remove("sidebar-collapsed");
        toggle.setAttribute("aria-expanded","false");
        toggle.setAttribute("aria-label","Open navigation");
    };

    toggle.addEventListener("click",()=>{
        const isOpen=document.body.classList.toggle("sidebar-collapsed");
        toggle.setAttribute("aria-expanded",String(isOpen));
        toggle.setAttribute("aria-label",isOpen?"Close navigation":"Open navigation");
    });

    closeButton?.addEventListener("click",closeSidebar);
    backdrop.addEventListener("click",closeSidebar);
    sidebar.querySelectorAll("nav a").forEach(link=>link.addEventListener("click",closeSidebar));
    document.addEventListener("keydown",event=>{
        if(event.key==="Escape") closeSidebar();
    });
    window.addEventListener("resize",()=>{
        if(window.matchMedia("(min-width: 993px)").matches) closeSidebar();
    });
}

</script>

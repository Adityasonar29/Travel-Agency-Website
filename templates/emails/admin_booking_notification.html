<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>New Booking Notification</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 20px; background-color: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 8px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #8B4513; margin: 0; font-size: 24px; }
        .booking-id { font-size: 28px; font-weight: bold; color: #8B4513; text-align: center; margin: 20px 0; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .label { color: #666; }
        .value { color: #333; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔔 New Booking Received</h1>
        </div>

        <div class="booking-id">{{ booking_id }}</div>

        <div class="info-row">
            <span class="label">Customer Name</span>
            <span class="value">{{ customer_name }}</span>
        </div>
        <div class="info-row">
            <span class="label">Tour</span>
            <span class="value">{{ tour_name }}</span>
        </div>
        <div class="info-row">
            <span class="label">Status</span>
            <span class="value">{{ status }}</span>
        </div>
        <div class="info-row">
            <span class="label">Amount</span>
            <span class="value">${{ amount|default:"0" }}</span>
        </div>

        <p style="margin-top: 20px; font-size: 14px; color: #666;">
            A new booking has been submitted. Please review and process this request according to your workflow.
        </p>
    </div>
</body>
</html>

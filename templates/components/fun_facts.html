<!-- Fun Facts — Accordion with Fixed Text Padding -->
<section class="py-24 bg-white">
    <div class="max-w-[1440px] mx-auto px-6 md:px-12 lg:px-24">
        
        <!-- Section Header -->
        <div class="text-center mb-16 scroll-reveal" style="opacity:0;">
            <p class="text-xs font-body text-gold tracking-[0.15em] uppercase mb-4">CURIOSITIES</p>
            <h2 class="text-h1 font-heading font-light text-ink">
                Travel <span class="text-gold italic">Insights</span>
            </h2>
        </div>

        <!-- Accordion Container -->
        <div class="flex flex-col md:flex-row gap-4 h-[800px] md:h-[520px] w-full scroll-reveal" style="opacity:0;">
            
            {% for fact in funfacts %}
            <div class="relative group flex-1 hover:flex-[3] transition-all duration-700 ease-in-out cursor-pointer overflow-hidden rounded-xl border border-sand bg-ink">
                
                <!-- Background Image -->
                <img src="{{ fact.image }}" alt="{{ fact.title }}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110 opacity-60 group-hover:opacity-40">
                
                <!-- Inner Container with Increased Padding (p-8 md:p-10) -->
                <div class="absolute inset-0 p-8 md:p-10 flex flex-col justify-end">
                    
                    <!-- Title and Emoji -->
                    <div class="flex items-center justify-between mb-4">
                        <!-- Fixed rotation positioning & breathing room -->
                        <h3 class="text-xl md:text-2xl font-heading font-medium text-white drop-shadow-md whitespace-nowrap transition-all duration-500 origin-bottom-left md:-rotate-90 group-hover:rotate-0 md:-translate-y-2 group-hover:translate-y-0 md:ml-3">
                            {{ fact.title }}
                        </h3>
                        {% if fact.emoji %}
                        <span class="text-2xl drop-shadow-md opacity-0 group-hover:opacity-100 transition-opacity duration-500 delay-200">
                            {{ fact.emoji }}
                        </span>
                        {% endif %}
                    </div>
                    
                    <!-- Description text (Reveals on hover) -->
                    <div class="grid grid-rows-[0fr] group-hover:grid-rows-[1fr] transition-all duration-700 ease-in-out">
                        <p class="text-sm md:text-base font-body text-white/90 overflow-hidden opacity-0 group-hover:opacity-100 transition-opacity duration-700 delay-100 leading-relaxed">
                            {{ fact.description }}
                        </p>
                    </div>
                    
                </div>
            </div>
            {% endfor %}
            
        </div>
    </div>
</section>

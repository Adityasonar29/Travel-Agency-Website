{% load static %}

<header class="admin-topbar">

    <div class="topbar-left admin-mobile-toggle">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle navigation">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <div class="topbar-right">

        <nav class="admin-quick-links" aria-label="Account links">
            <a href="{% url 'accounts:profile' %}">Profile</a>
            <a href="/">View Website</a>
        </nav>

        <div class="admin-profile">
            <div class="profile-info">
                <span class="profile-name">
                    {{ request.user.get_full_name|default:request.user.username }}
                </span>
                <span class="profile-role">
                <span class="profile-role">Administrator</span>
            </div>

            <div class="profile-image">
                {% if request.user.profile_image %}
                    <img src="{{ request.user.profile_image.url }}" alt="">
                {% else %}
                    <span class="profile-fallback-avatar">{{ request.user.first_name|default:request.user.username|first|upper }}</span>
                {% endif %}
            </div>

        </div>

    </div>

</header>

<script>

const profile=document.querySelector(".admin-profile");

if(profile){

    profile.addEventListener("click",function(){

        this.classList.toggle("open");

    });

}

const toggle=document.getElementById("sidebarToggle");

if(toggle){

    toggle.addEventListener("click",()=>{

        document.body.classList.toggle("sidebar-collapsed");

    });

}

</script>

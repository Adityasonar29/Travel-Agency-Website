<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ subject }}</title>
    <style>
      /* Minimal inline-friendly styles */
      body { font-family: Arial, Helvetica, sans-serif; background:#f5f5f5; margin:0; padding:24px; }
      .email-wrap { max-width:680px; margin:0 auto; background:#ffffff; border-radius:8px; overflow:hidden; }
      .header { padding:24px; background:#1A1A1A; color:#fff; display:flex; align-items:center; gap:12px }
      .logo { font-weight:700; font-size:18px; }
      .banner { width:100%; height:160px; background:#C8A96E; display:block; }
      .content { padding:28px; color:#333; }
      .card { background:#f8f8f8; padding:16px; border-radius:8px; margin:12px 0; }
      .cta { display:inline-block; background:#1A1A1A; color:#fff; padding:12px 18px; border-radius:6px; text-decoration:none; }
      .footer { padding:18px; background:#fafafa; font-size:12px; color:#666; text-align:center }
    </style>
  </head>
  <body>
    <div class="email-wrap">
      <div class="header">
        <div class="logo">VOYAGE</div>
        <div style="margin-left:auto">Travel Agency</div>
      </div>
      <div class="banner"></div>
      <div class="content">
        <h2>{{ heading }}</h2>
        <div>
          {% block body %}{% endblock %}
        </div>
      </div>
      <div class="footer">
        Need help? Contact us at <a href="mailto:support@agency.com">support@agency.com</a> • +91 XXXXX XXXXX
        <div style="margin-top:8px">© {{ now|date:"Y" }} Voyage Travel Agency</div>
      </div>
    </div>
  </body>
</html>

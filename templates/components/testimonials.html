<!-- Testimonials Section (Fixed Height Overlap) -->
<section class="py-24 md:py-32 bg-cream">
    <div class="max-w-[1000px] mx-auto px-6 md:px-12 text-center">
        <p class="text-xs font-body text-gold tracking-[0.15em] uppercase mb-8 scroll-reveal" style="opacity:0;">TESTIMONIALS</p>

        <!-- Testimonial Carousel (CSS Grid magically fixes the height!) -->
        <div id="testimonial-carousel" class="grid" style="grid-template-columns: 1fr;">
            {% for testimonial in testimonials %}
            <div class="testimonial-slide flex flex-col items-center justify-center transition-all duration-700 {% if forloop.first %}opacity-100 z-10 pointer-events-auto{% else %}opacity-0 z-0 pointer-events-none{% endif %}" style="grid-area: 1 / 1;" data-index="{{ forloop.counter0 }}">
                
                <div class="text-gold text-5xl font-heading mb-6">"</div>
                
                <p class="text-h3 md:text-h2 font-heading font-light italic text-ink leading-relaxed mb-8">
                    {{ testimonial.quote }}
                </p>
                
                <div>
                    <p class="text-sm font-body font-medium text-ink tracking-wide">{{ testimonial.author_name }}</p>
                    <p class="text-xs font-body text-ink-muted tracking-[0.1em] uppercase mt-1">{{ testimonial.author_destination }}</p>
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="flex items-center justify-center gap-3 mt-12">
            {% for testimonial in testimonials %}
            <button class="testimonial-dot w-2 h-2 rounded-full transition-all duration-300 {% if forloop.first %}bg-gold w-6{% else %}bg-[#D4C9BC]{% endif %}" data-index="{{ forloop.counter0 }}"></button>
            {% endfor %}
        </div>
    </div>
</section>

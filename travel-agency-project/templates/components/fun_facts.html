<!-- Fun Facts — Infinite draggable carousel (Armenia.travel style) -->
<div class="max-w-[1440px] mx-auto px-6 md:px-12 lg:px-24 mb-12">
    <p class="text-xs font-body text-gold tracking-[0.15em] uppercase mb-4 scroll-reveal" style="opacity:0;">FUN FACTS</p>
    <h2 class="text-h1 font-heading font-light text-ink scroll-reveal" style="opacity:0;">
        Drag to <span class="text-gold italic">Discover</span>
    </h2>
</div>

<!-- Infinite Drag Carousel -->
<div class="relative overflow-hidden" id="drag-wrapper">
    <div id="drag-track" class="flex gap-6 px-6 md:px-12 lg:px-24 will-change-transform">
        {% for fact in funfacts %}
        <div class="drag-card flex-shrink-0 w-[260px] md:w-[320px] bg-white rounded-2xl overflow-hidden shadow-lg transition-transform duration-300 {% if forloop.counter0|divisibleby:2 %}rotate-[-2deg]{% else %}rotate-[2deg]{% endif %}">
            <div class="relative h-[180px] md:h-[200px] overflow-hidden">
                <img src="{{ fact.image }}" alt="{{ fact.title }}" class="w-full h-full object-cover" loading="lazy">
                {% if fact.emoji %}<div class="absolute top-4 right-4 text-3xl">{{ fact.emoji }}</div>{% endif %}
            </div>
            <div class="p-5 md:p-6">
                <h3 class="text-lg md:text-h3 font-heading font-medium text-ink mb-2">{{ fact.title }}</h3>
                <p class="text-sm font-body text-ink-muted leading-relaxed">{{ fact.description }}</p>
            </div>
        </div>
        {% endfor %}
        <!-- DUPLICATE for infinite loop -->
        {% for fact in funfacts %}
        <div class="drag-card flex-shrink-0 w-[260px] md:w-[320px] bg-white rounded-2xl overflow-hidden shadow-lg transition-transform duration-300 {% if forloop.counter0|divisibleby:2 %}rotate-[-2deg]{% else %}rotate-[2deg]{% endif %}">
            <div class="relative h-[180px] md:h-[200px] overflow-hidden">
                <img src="{{ fact.image }}" alt="{{ fact.title }}" class="w-full h-full object-cover" loading="lazy">
                {% if fact.emoji %}<div class="absolute top-4 right-4 text-3xl">{{ fact.emoji }}</div>{% endif %}
            </div>
            <div class="p-5 md:p-6">
                <h3 class="text-lg md:text-h3 font-heading font-medium text-ink mb-2">{{ fact.title }}</h3>
                <p class="text-sm font-body text-ink-muted leading-relaxed">{{ fact.description }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
    <!-- Drag hint — quarter circle -->
    <div class="absolute bottom-6 right-6 md:right-12 w-16 h-16 md:w-20 md:h-20 rounded-full border border-gold/30 flex items-end justify-start p-2 overflow-hidden pointer-events-none">
        <span class="text-[8px] font-body text-gold/60 tracking-wider uppercase">drag</span>
    </div>
</div>

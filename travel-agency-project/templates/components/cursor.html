<!-- Custom Cursor (FILLED inversion circle — no tiny dot) -->
<div id="cursor-ring" class="fixed top-0 left-0 pointer-events-none z-[9998] hidden md:block"
     style="width:40px;height:40px;margin-left:-20px;margin-top:-20px;border-radius:50%;
            background:#ffffff;mix-blend-mode:difference;
            will-change:transform;transition:width 0.3s,height 0.3s,margin 0.3s,opacity 0.3s;
            opacity:0.85;"></div>
<!-- Small inner dot for precision -->
<div id="cursor-dot" class="fixed top-0 left-0 pointer-events-none z-[9999] hidden md:block"
     style="width:6px;height:6px;margin-left:-3px;margin-top:-3px;border-radius:50%;
            background:#ffffff;mix-blend-mode:difference;will-change:transform;"></div>

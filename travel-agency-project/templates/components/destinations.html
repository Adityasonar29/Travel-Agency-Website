<!-- Destinations Section (Spain Collection — cards rise + image swap on hover) -->
<section class="py-24 md:py-40 bg-white">
    <div class="max-w-[1440px] mx-auto px-6 md:px-12 lg:px-24">
        <!-- Header -->
        <div class="text-center mb-16">
            <p class="text-xs font-body text-gold tracking-[0.15em] uppercase mb-4 scroll-reveal" style="opacity:0;">SIGNATURE DESTINATIONS</p>
            <h2 class="text-h1 font-heading font-light text-ink scroll-reveal" style="opacity:0;">Where Will You Go?</h2>
        </div>

        <!-- Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for dest in destinations %}
            <a href="{{ dest.get_absolute_url }}" class="rise-card group cursor-pointer block" style="opacity:0;transform:translateY(100px);">
                <div class="relative aspect-[3/4] overflow-hidden rounded-lg">
                    <!-- Default Image -->
                    <img src="{{ dest.image }}" alt="{{ dest.name }}" class="card-img-default absolute inset-0 w-full h-full object-cover transition-opacity duration-500">
                    <!-- Hover Image -->
                    {% if dest.hover_image %}
                    <img src="{{ dest.hover_image }}" alt="{{ dest.name }}" class="card-img-hover absolute inset-0 w-full h-full object-cover opacity-0 transition-all duration-500 scale-110">
                    {% endif %}
                    <!-- Dark Overlay -->
                    <div class="absolute inset-0 bg-gradient-to-t from-ink/80 via-ink/20 to-transparent"></div>
                    <!-- Content -->
                    <div class="absolute bottom-0 left-0 right-0 p-6">
                        <p class="text-[10px] font-body text-gold-light tracking-[0.15em] uppercase mb-2">{{ dest.country }}</p>
                        <h3 class="text-h3 font-heading font-light text-white tracking-wide">{{ dest.name }}</h3>
                        <div class="mt-4 flex items-center gap-2 text-[10px] font-body text-gold-light tracking-[0.15em] uppercase transition-transform duration-300 group-hover:translate-x-2">
                            Discover <span>→</span>
                        </div>
                    </div>
                    <!-- Corner Accent -->
                    <div class="absolute top-4 right-4 w-8 h-8 border-t border-r border-gold/0 group-hover:border-gold/50 transition-all duration-300 opacity-0 group-hover:opacity-100"></div>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
</section>

<!-- Deck Loading Screen (Travelling Distribution style) -->
<div id="loading-screen" class="fixed inset-0 z-[9999] bg-ink flex items-center justify-center overflow-hidden">
    <!-- Deck of Images -->
    <div id="deck-container" class="relative w-[240px] h-[320px] md:w-[350px] md:h-[480px]">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&q=80" class="deck-card absolute inset-0 w-full h-full object-cover rounded-lg shadow-2xl" style="opacity:0;" alt="Travel 1">
        <img src="https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=600&q=80" class="deck-card absolute inset-0 w-full h-full object-cover rounded-lg shadow-2xl" style="opacity:0;" alt="Travel 2">
        <img src="https://images.unsplash.com/photo-1530789253388-582c481c54b0?w=600&q=80" class="deck-card absolute inset-0 w-full h-full object-cover rounded-lg shadow-2xl" style="opacity:0;" alt="Travel 3">
        <img src="https://images.unsplash.com/photo-1488085061387-422e29b40080?w=600&q=80" class="deck-card absolute inset-0 w-full h-full object-cover rounded-lg shadow-2xl" style="opacity:0;" alt="Travel 4">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600&q=80" class="deck-card absolute inset-0 w-full h-full object-cover rounded-lg shadow-2xl" style="opacity:0;" alt="Travel 5">
    </div>
    <!-- Logo -->
    <div id="loading-logo" class="absolute inset-0 flex items-center justify-center" style="opacity:0;">
        <div class="text-center">
            <h1 class="text-display font-heading font-light text-white tracking-tight">VOYAGE</h1>
            <div class="h-[1px] bg-gold mx-auto mt-4" style="width:0;" id="logo-line"></div>
            <p class="text-xs font-body text-stone tracking-[0.3em] uppercase mt-4" style="opacity:0;" id="logo-sub">Travel Agency</p>
        </div>
    </div>
</div>
